team_id: example-team
config_revision: "1"
time_zone: UTC
suppression_file: examples/suppressions.yaml
sources:
  - id: example-health
    type: log_query
    settings:
      mode: "${LOG_QUERY_MODE:-fixture}"
      fixture: "${LOG_QUERY_FIXTURE:-fixtures/log_query_rows.json}"
sections:
  - id: failures
    title: Failures
    ordering: 10
    signal_kinds: [error]
    threshold: 1
    grouping_key: component
tracker:
  type: azure_devops
  settings:
    mode: "${AZDO_MODE:-fixture}"
    fixture: "${AZDO_FIXTURE:-fixtures/azure_devops_work_items.json}"
ai_triage:
  enabled: true
  section_verdict_rules:
    failures: [known_pattern, actionable, insufficient_evidence, recheck]
